function pl(name,min,pos,vm,rev){
 try{
  if(!en||!ctx||ctx.state!=='running'||!S[name])return;

  const dst=ctx.createGain();dst.gain.value=(vm||1)*g;let nd=dst;
  if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=pan;dst.connect(p);nd=p}
  nd.connect(out);if(rev&&rv){const s=ctx.createGain();s.gain.value=rev;nd.connect(s);s.connect(rv)}
  voices++;setTimeout(()=>{voices--},900);
  S[name](now+.005,dst,rnd(.93,1.07));
 }catch(e){}
}
